<style>
@font-face{font-family:Saira;src:url(fonts/saira-300.woff2) format('woff2');font-weight:300}
@font-face{font-family:Saira;src:url(fonts/saira-400.woff2) format('woff2');font-weight:400}
@font-face{font-family:Saira;src:url(fonts/saira-500.woff2) format('woff2');font-weight:500}

@font-face{font-family:Saira;src:url(fonts/saira-700.woff2) format('woff2');font-weight:700}

:root{
  --petrol:#1E2F38;--petrol-rgb:30,47,56;
  --deep:#0f1a20;--deep-rgb:15,26,32;
  --off:#F5F2F0;--off-rgb:245,242,240;
  --orange:#FF9D27;--orange-rgb:255,157,39;
  --lilac:#A490FF;--lilac-rgb:164,144,255;
  --violet:#6040cc;--violet-rgb:96,64,204;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;overflow:hidden;background:#fff}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Saira,sans-serif;color:var(--petrol);
  background:radial-gradient(2100px 1300px at 45% 38%,#fff 30%,rgba(var(--off-rgb),.82) 100%)}
.scene{position:absolute;inset:0;display:none}
.kicker{font-size:23px;font-weight:700;letter-spacing:.38em;text-transform:uppercase;color:var(--violet)}
h1,h2,h3{font-weight:800;line-height:1.04;letter-spacing:-.018em;color:var(--petrol)}
.body{font-size:27px;font-weight:300;line-height:1.52;color:rgba(var(--petrol-rgb),.72)}
.brick{width:14px;height:19px;clip-path:polygon(12% 0,100% 0,100% 88%,88% 100%,0 100%,0 12%);background:var(--lilac);flex:0 0 auto}
.marker{display:flex;align-items:center;gap:17px;font-size:25px;font-weight:600;line-height:1.25;color:var(--petrol)}
.marker .rule{width:36px;height:2px;background:var(--lilac);flex:0 0 auto}
.photo-card{position:absolute;background:#fff;border:1px solid rgba(var(--petrol-rgb),.12);border-radius:18px;padding:14px;
  box-shadow:0 34px 80px rgba(var(--petrol-rgb),.13)}
.photo-card .crop{width:100%;height:100%;overflow:hidden;border-radius:10px;background:rgba(var(--petrol-rgb),.08)}
.photo-card img{display:block;width:100%;height:100%;object-fit:cover;transform-origin:center}

/* Team slide, now after «Precision through care», using the real rooftop working image. */
#s6photo{left:94px;top:88px;width:1010px;height:904px}
#s6photo img{object-position:center 47%}
#s6copy{position:absolute;left:1180px;top:160px;width:610px}
#s6title{font-size:78px;margin:28px 0 70px}
.person{padding:0 0 34px;margin-bottom:34px;border-bottom:1px solid rgba(var(--petrol-rgb),.14)}
.person:last-child{border-bottom:0}
.person h3{font-size:32px;margin-bottom:8px}
.person .role{font-size:18px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--violet);margin-bottom:13px}
.person .expertise{font-size:22px;font-weight:400;line-height:1.4;color:rgba(var(--petrol-rgb),.66)}

/* Service slides: two or three services each, v2's names and sub-items, no paragraphs. */
.grp-copy{position:absolute;left:140px;top:120px;width:930px;height:760px;display:flex;flex-direction:column;justify-content:center}
.grp-list{display:flex;flex-direction:column;gap:38px;margin-top:44px}
.grp-head{display:flex;align-items:center;gap:20px}
.grp-head .rule{width:36px;height:3px;background:var(--lilac);flex:0 0 auto}
.grp-name{font-size:50px}
.grp-subs{display:flex;flex-wrap:wrap;gap:10px 30px;margin:15px 0 0 56px}
.grp-sub{display:flex;align-items:center;gap:11px;font-size:21px;font-weight:500;line-height:1.3;white-space:nowrap;color:rgba(var(--petrol-rgb),.7)}
.grp-sub::before{content:'';width:14px;height:2px;background:var(--lilac);flex:0 0 auto}
.grp-photo{left:1120px;top:150px;width:660px;height:710px}
.svc-dots{position:absolute;left:140px;top:890px;display:flex;gap:13px}
.svc-dots i{width:11px;height:11px;border-radius:50%;background:rgba(var(--petrol-rgb),.15)}
.svc-dots i.on{background:var(--lilac);box-shadow:0 0 0 5px rgba(var(--lilac-rgb),.22)}

/* Logo wall. */
#s1head{position:absolute;left:0;right:0;top:130px;text-align:center}
#s1title{font-size:62px;margin-top:26px}
#s1grid{position:absolute;left:130px;right:130px;top:340px;display:flex;flex-wrap:wrap;justify-content:center}
.logo-cell{flex:0 0 calc(100% / 6);height:190px;display:flex;align-items:center;justify-content:center}
.logo-cell img{display:block;max-width:205px;max-height:74px;object-fit:contain;filter:brightness(0);opacity:.75}

/* About, who we are, governance and compliance move to the final act. */
.centred-head{position:absolute;left:0;right:0;top:132px;text-align:center}
.centred-head h2{font-size:64px;margin-top:27px}
#s5cards{position:absolute;left:142px;right:142px;top:390px;display:flex;gap:34px}
.care-card{position:relative;flex:1;height:370px;padding:42px 42px 38px;background:#fff;border:1px solid rgba(var(--petrol-rgb),.12);border-radius:18px;
  box-shadow:0 22px 52px rgba(var(--petrol-rgb),.08)}
.care-card .n{font-size:21px;font-weight:800;letter-spacing:.2em;color:var(--lilac);margin-bottom:29px}
.care-card h3{font-size:34px;margin-bottom:20px}
.care-card p{font-size:23px;font-weight:300;line-height:1.45;color:rgba(var(--petrol-rgb),.68)}

#s7copy{position:absolute;left:154px;top:165px;width:930px}
#s7title{font-size:70px;margin:29px 0 54px}
#s7lead{width:900px}
#s7points{position:absolute;left:1185px;top:264px;width:560px;display:flex;flex-direction:column;gap:27px}
.big-point{padding:24px 30px;border-left:4px solid var(--lilac);font-size:31px;font-weight:700;background:rgba(255,255,255,.62)}

#s8grid{position:absolute;left:150px;right:150px;top:380px;display:grid;grid-template-columns:repeat(2,1fr);gap:28px 34px}
.gov-point{height:178px;display:flex;align-items:center;gap:25px;padding:30px 35px;background:#fff;border:1px solid rgba(var(--petrol-rgb),.12);border-radius:16px;
  box-shadow:0 18px 40px rgba(var(--petrol-rgb),.07)}
.gov-point b{font-size:31px;line-height:1.2}

#s9cards{position:absolute;left:150px;right:150px;top:395px;display:flex;gap:36px}
.compliance-card{flex:1;height:270px;padding:42px 38px;border:1px solid rgba(var(--petrol-rgb),.13);background:#fff;border-radius:17px;
  box-shadow:0 20px 44px rgba(var(--petrol-rgb),.08)}
.compliance-card .n{font-size:22px;font-weight:800;letter-spacing:.2em;color:var(--lilac);margin-bottom:35px}
.compliance-card h3{font-size:36px}

/* Final credentials remain visible on the final frame. */
#s10lock{position:absolute;left:0;right:0;top:192px;text-align:center}
#s10lock img{width:620px;display:inline-block}
#s10company{position:absolute;left:0;right:0;top:463px;text-align:center;font-size:23px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(var(--petrol-rgb),.58)}
#s10line{position:absolute;left:0;right:0;top:525px;text-align:center;font-size:45px;font-weight:800;letter-spacing:.025em}
#s10credentials{position:absolute;left:0;right:0;top:641px;display:flex;justify-content:center;gap:20px}
.credential{padding:13px 25px;border:1px solid rgba(var(--petrol-rgb),.17);border-radius:999px;background:#fff;font-size:21px;font-weight:600}
#s10contact{position:absolute;left:0;right:0;top:754px;text-align:center;font-size:22px;font-weight:400;color:rgba(var(--petrol-rgb),.62)}
#s10url{position:absolute;left:0;right:0;top:823px;text-align:center;font-size:28px;font-weight:700;letter-spacing:.12em;color:var(--violet)}

#grid{position:absolute;inset:0;opacity:.46;background-image:linear-gradient(rgba(var(--petrol-rgb),.042) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--petrol-rgb),.042) 1px,transparent 1px);background-size:96px 96px}
#vig{position:absolute;inset:0;background:radial-gradient(1500px 920px at 50% 45%,transparent 58%,rgba(var(--petrol-rgb),.085) 100%);pointer-events:none}
#grain{position:absolute;inset:0;opacity:.03;mix-blend-mode:multiply;pointer-events:none}
#wm{position:absolute;top:43px;right:50px;opacity:0}
#wm img{display:block;width:62px}
</style>

<div id="stage">
  <div id="grid"></div>

  <div class="scene" id="s0"></div>

  <div class="scene" id="s1">
    <div id="s1head"><div class="kicker" id="s1kicker"></div><h2 id="s1title"></h2></div>
    <div id="s1grid"></div>
  </div>

  <div class="scene" id="s2"></div>
  <div class="scene" id="s3"></div>
  <div class="scene" id="s4"></div>

  <div class="scene" id="s5">
    <div class="centred-head"><div class="kicker" id="s5kicker"></div><h2 id="s5title"></h2></div>
    <div id="s5cards"></div>
  </div>

  <div class="scene" id="s6">
    <div class="photo-card" id="s6photo"><div class="crop"><img id="s6img"></div></div>

  </div>

  <div class="scene" id="s7">
    <div id="s7copy"><div class="kicker" id="s7kicker"></div><h2 id="s7title"></h2><div class="body" id="s7lead"></div></div>
    <div id="s7points"></div>
  </div>

  <div class="scene" id="s8">

    <div id="s8grid"></div>
  </div>

  <div class="scene" id="s9">
    <div class="centred-head"><div class="kicker" id="s9kicker"></div><h2 id="s9title"></h2></div>
    <div id="s9cards"></div>
  </div>

  <div class="scene" id="s10">
    <div id="s10lock"><img src="logos/lockup-blacktext-lilacbrick.svg"></div>
    <div id="s10company"></div><div id="s10line"></div>
    <div id="s10credentials"></div><div id="s10contact"></div><div id="s10url"></div>
  </div>

  <div id="vig"></div>
  <svg id="grain" width="1920" height="1080"><filter id="noise"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/></filter><rect width="1920" height="1080" filter="url(#noise)"/></svg>
  <div id="wm"><img src="logos/ws-square-black.svg"></div>
</div>

<script>
const C=window.CONTENT;
const FPS=30;
const $=s=>document.querySelector(s);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const c01=x=>clamp(x,0,1);
const lerp=(a,b,p)=>a+(b-a)*p;
const RGB=h=>parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16);
const E={o:p=>1-Math.pow(1-p,3),oq:p=>1-Math.pow(1-p,5),io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,lin:p=>p};

const TDEF={petrol:'#1E2F38',deep:'#0f1a20',off:'#F5F2F0',orange:'#FF9D27',lilac:'#A490FF',violet:'#6040cc'};
window.applyTheme=function(theme){const r=document.documentElement.style;for(const k in TDEF){const v=theme[k]||TDEF[k];r.setProperty('--'+k,v);r.setProperty('--'+k+'-rgb',RGB(v));}};
window.applyTheme(C.theme);
const TMAP=[];
for(const k in TDEF){const v=C.theme[k];if(v&&v.toLowerCase()!==TDEF[k].toLowerCase())TMAP.push([new RegExp(TDEF[k],'gi'),v]);}
const T=s=>{if(s==null)return s;let o=String(s);for(const[a,b]of TMAP)o=o.replace(a,b);return o;};
const set=(sel,html)=>{const el=$(sel);if(el&&html!=null)el.innerHTML=T(html);};

const anims=[];
function at(t0,dur,fn,ease=E.o){anims.push({t0,t1:t0+dur,fn,ease});}
function tick(t){for(const a of anims){const p=a.t1>a.t0?c01((t-a.t0)/(a.t1-a.t0)):(t>=a.t0?1:0);a.fn(a.ease(p),t);}}
function rise(el,t0,dur,dy=34,ease=E.oq){el.style.opacity=0;at(t0,dur,p=>{el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px)`;},ease);}

/* Three seconds a slide (Heron, 25 Nov); the closing card holds a little longer as the end card. */
const SC=[
  ['#s0',0,3],['#s1',3,6],['#s2',6,9],['#s3',9,12],['#s4',12,15],
  ['#s5',15,18],['#s6',18,21],['#s7',21,24],['#s8',24,27],['#s9',27,30],['#s10',30,33.5]
];
const TL=(window.TIMELINE&&window.TIMELINE.film)||null;
const SC_EDIT=SC.map(([sel,a,b])=>{const s=TL&&(TL.scenes||[]).find(x=>'#'+x.id===sel);return s?[sel,+s.start,+s.end]:[sel,a,b];});
const WARP_PTS=SC_EDIT.map(([_,a],i)=>[a,SC[i][1]]).concat([[SC_EDIT[SC_EDIT.length-1][2],SC[SC.length-1][2]]]);
function warp(t){const P=WARP_PTS;if(t<=P[0][0])return P[0][1]+(t-P[0][0]);for(let i=1;i<P.length;i++)if(t<=P[i][0]){const x0=P[i-1][0],y0=P[i-1][1],x1=P[i][0],y1=P[i][1];return x1>x0?y0+(t-x0)*(y1-y0)/(x1-x0):y1;}return P[P.length-1][1]+(t-P[P.length-1][0]);}
/* Overlapping cuts: the incoming slide is live from its first frame and its elements rise straight in,
   while the outgoing slide lifts and fades over XO seconds past its window, so no frame lands on bare background.
   The closing card holds to the last frame. */
const XO=.36,LIFT=56;
function sceneVis(t){const last=SC.length-1;SC.forEach(([sel,a,b],i)=>{const el=$(sel),end=i===last?b:b+XO;
  if(t>=a-.02&&t<=end+.02){el.style.display='block';let o=1,y=0;
    if(i<last&&t>b){const p=E.io(c01((t-b)/XO));o=1-p;y=-LIFT*p;}
    el.style.opacity=o;el.style.transform=y?`translateY(${y}px)`:'';}
  else el.style.display='none';});}
const DUR=SC_EDIT[SC_EDIT.length-1][2];
const A=Object.fromEntries(SC.map(([sel,a,b])=>[sel.slice(1),{a,b}]));   // authored scene windows

/* Service slides s0, s2, s3, s4: about three seconds each; the services land one, two, three.
   The first slide is on screen at frame zero, its photo already in place. */
const GROUP_SCENES=['s0','s2','s3','s4'];
C.groups.forEach((g,i)=>{
  const id=GROUP_SCENES[i],sc=$('#'+id),{a,b}=A[id],first=i===0,o=first?.06:.08;
  sc.innerHTML=`<div class="photo-card grp-photo"><div class="crop"><img src="photos/${T(g.photo)}"></div></div>`+
    `<div class="grp-copy"><div class="kicker grp-eyebrow"><span>${T(C.deliver.kicker)}</span> · <span>${T(g.eyebrow)}</span></div><div class="grp-list">`+
    g.services.map(s=>`<div class="grp-svc"><div class="grp-head"><span class="rule"></span><h2 class="grp-name">${T(s.name)}</h2></div>`+
      (s.markers.length?`<div class="grp-subs">${s.markers.map(m=>`<div class="grp-sub">${T(m)}</div>`).join('')}</div>`:'')+`</div>`).join('')+
    `</div></div><div class="svc-dots">${C.groups.map((_,j)=>`<i${j===i?' class="on"':''}></i>`).join('')}</div>`;
  if(!first)rise(sc.querySelector('.grp-photo'),a+.04,.5,28);
  rise(sc.querySelector('.grp-eyebrow'),a+o,.38,16);
  [...sc.querySelectorAll('.grp-svc')].forEach((el,k)=>{
    const t0=a+o+.12+k*.32;
    rise(el.querySelector('.grp-head'),t0,.42,24);
    [...el.querySelectorAll('.grp-sub')].forEach((s,j)=>rise(s,t0+.1+j*.05,.36,12));
  });
  rise(sc.querySelector('.svc-dots'),a+o+.24,.38,12);
  const img=sc.querySelector('img');at(a,b-a,p=>{img.style.transform=`scale(${lerp(first?1.055:1.07,1,p)})`;},E.lin);
});

/* Certified applicators straight after the first service slide: v2's twelve, then CSR, Cemintel, Parchem and Fosroc. */
set('#s1kicker',C.logos.kicker);set('#s1title',C.logos.title);
const LOGOS=[['sto.png',66],['dulux.png',44],['calce.png',76],['cemher.png',35],['murobond.png',35],['euromix.svg',32],['unitex.svg',44],['basroc.svg',25],['rockcote.svg',32],['knauf.svg',50],['pietra-marble.svg',47],['mineral-fox.svg',19],
  ['csr.svg',66],['cemintel.svg',40],['parchem.png',52],['fosroc.svg',72]];
$('#s1grid').innerHTML=LOGOS.map(([f,h])=>`<div class="logo-cell"><img src="applicators/${f}" style="height:${h}px"></div>`).join('');
rise($('#s1kicker'),A.s1.a+.08,.38,16);rise($('#s1title'),A.s1.a+.16,.44,24);
[...document.querySelectorAll('.logo-cell')].forEach((el,i)=>rise(el,A.s1.a+.34+(i%6)*.06+Math.floor(i/6)*.14,.4,18));

/* Precision through care. */
set('#s5kicker',C.about.kicker);set('#s5title',C.about.title);
$('#s5cards').innerHTML=C.about.cards.map(c=>`<div class="care-card"><div class="n">${T(c.number)}</div><h3>${T(c.heading)}</h3><p>${T(c.body)}</p></div>`).join('');
rise($('#s5kicker'),A.s5.a+.08,.38,16);rise($('#s5title'),A.s5.a+.16,.44,24);
[...document.querySelectorAll('.care-card')].forEach((el,i)=>rise(el,A.s5.a+.36+i*.14,.5,30));

/* Team slide. */
$('#s6img').src='photos/'+C.team.photo;set('#s6kicker',C.team.kicker);set('#s6title',C.team.title);
$('#s6people').innerHTML=C.team.people.map(p=>`<div class="person"><h3>${T(p.name)}</h3><div class="role">${T(p.role)}</div><div class="expertise">${T(p.expertise)}</div></div>`).join('');
rise($('#s6photo'),A.s6.a+.04,.5,28);rise($('#s6kicker'),A.s6.a+.08,.38,16);rise($('#s6title'),A.s6.a+.16,.44,24);
[...document.querySelectorAll('.person')].forEach((el,i)=>rise(el,A.s6.a+.38+i*.18,.46,22));
at(A.s6.a,A.s6.b-A.s6.a,p=>{$('#s6img').style.transform=`scale(${lerp(1.05,1,p)})`;},E.lin);

/* Who we are. */
set('#s7kicker',C.who.kicker);set('#s7title',C.who.title);set('#s7lead',C.who.lead);
$('#s7points').innerHTML=C.who.points.map(p=>`<div class="big-point">${T(p)}</div>`).join('');
rise($('#s7kicker'),A.s7.a+.08,.38,16);rise($('#s7title'),A.s7.a+.16,.46,24);rise($('#s7lead'),A.s7.a+.32,.46,24);
[...document.querySelectorAll('.big-point')].forEach((el,i)=>rise(el,A.s7.a+.46+i*.14,.44,22));

/* The WS Way. */
set('#s8kicker',C.governance.kicker);set('#s8title',C.governance.title);
$('#s8grid').innerHTML=C.governance.points.map(p=>`<div class="gov-point"><span class="brick"></span><b>${T(p)}</b></div>`).join('');
rise($('#s8kicker'),A.s8.a+.08,.38,16);rise($('#s8title'),A.s8.a+.16,.44,24);
[...document.querySelectorAll('.gov-point')].forEach((el,i)=>rise(el,A.s8.a+.36+i*.12,.46,24));

/* Compliance title kept verbatim. */
set('#s9kicker',C.compliance.kicker);set('#s9title',C.compliance.title);
$('#s9cards').innerHTML=C.compliance.pillars.map(p=>`<div class="compliance-card"><div class="n">${T(p.number)}</div><h3>${T(p.heading)}</h3></div>`).join('');
rise($('#s9kicker'),A.s9.a+.08,.38,16);rise($('#s9title'),A.s9.a+.16,.44,24);
[...document.querySelectorAll('.compliance-card')].forEach((el,i)=>rise(el,A.s9.a+.36+i*.14,.48,28));

/* Final legal identity and contact details. The Queensland licence pill appears only once final.licenceQld is filled. */
set('#s10company',C.final.company);set('#s10line',C.final.line);set('#s10contact',C.final.contact);set('#s10url',C.final.url);
$('#s10credentials').innerHTML=[C.final.abn,C.final.licence,C.final.licenceQld].filter(v=>v!=null&&String(v).trim()!=='')
  .map(v=>`<div class="credential">${T(v)}</div>`).join('');
rise($('#s10lock'),A.s10.a+.08,.42,18);rise($('#s10company'),A.s10.a+.2,.4,16);rise($('#s10line'),A.s10.a+.32,.44,20);
[...document.querySelectorAll('.credential')].forEach((el,i)=>rise(el,A.s10.a+.48+i*.1,.4,16));
rise($('#s10contact'),A.s10.a+.7,.4,16);rise($('#s10url'),A.s10.a+.84,.4,16);

/* Watermark: off on the opening slide and the closing card, as in v2. */
at(A.s1.a+.05,.4,p=>{$('#wm').style.opacity=p*.52;});
