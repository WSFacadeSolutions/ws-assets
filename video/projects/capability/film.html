<style>
@font-face{font-family:Saira;src:url(fonts/saira-300.woff2) format('woff2');font-weight:300}
@font-face{font-family:Saira;src:url(fonts/saira-400.woff2) format('woff2');font-weight:400}

@font-face{font-family:Saira;src:url(fonts/saira-800.woff2) format('woff2');font-weight:800}
/* brand palette vars — same theme contract as film.html: the theme boot overwrites
   these from C.theme. Capability statement piece: white paper, petrol ink, the
   colour play lives in lilac/violet only (no orange anywhere in this composition). */
:root{
  --petrol:#1E2F38; --petrol-rgb:30,47,56;
  --deep:#0f1a20;   --deep-rgb:15,26,32;
  --off:#F5F2F0;    --off-rgb:245,242,240;
  --orange:#FF9D27; --orange-rgb:255,157,39;
  --lilac:#A490FF;  --lilac-rgb:164,144,255;
  --violet:#6040cc; --violet-rgb:96,64,204;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#fff;width:1920px;height:1080px;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;
  font-family:Saira,sans-serif;color:var(--petrol);
  background:radial-gradient(2100px 1300px at 50% 42%,#ffffff 34%,#f2efeb 100%)}
.scene{position:absolute;inset:0;display:none}
.kicker{font-weight:600;font-size:25px;letter-spacing:.42em;color:var(--violet);text-transform:uppercase}
h1,h2{font-weight:800;color:var(--petrol);line-height:1.05;letter-spacing:-.012em}
h1 em{font-style:normal;color:var(--lilac)}
.body{font-weight:300;color:rgba(var(--petrol-rgb),.75);line-height:1.5}
.chip{display:inline-flex;align-items:center;gap:13px;border:1px solid rgba(var(--petrol-rgb),.18);
  border-radius:999px;padding:13px 30px;font-weight:500;font-size:27px;color:var(--petrol);
  background:rgba(255,255,255,.8);white-space:nowrap;box-shadow:0 10px 30px rgba(var(--petrol-rgb),.07)}
.chip .dot{width:11px;height:11px;border-radius:50%;background:var(--lilac);flex:0 0 auto}
/* stat card (s1) */
.statcard{position:absolute;background:#fff;border:1px solid #E4E0DC;border-radius:18px;
  box-shadow:0 26px 60px rgba(var(--petrol-rgb),.08);padding:44px 48px;display:flex;flex-direction:column;gap:30px}
.statrow{display:flex;align-items:center;gap:30px}
.statrow b{font-size:74px;font-weight:800;letter-spacing:-.02em;line-height:1;flex:0 0 128px;color:var(--petrol)}
.statrow span{font-size:24px;font-weight:500;color:rgba(var(--petrol-rgb),.62);line-height:1.4}
.statdiv{height:1px;background:#E4E0DC}
/* service scenes */
.svc-photo{position:absolute;left:1005px;top:172px;width:775px;height:646px;background:#fff;
  border:1px solid #E4E0DC;border-radius:16px;padding:14px;box-shadow:0 34px 80px rgba(var(--petrol-rgb),.12)}
.svc-photo .ph{width:100%;height:100%;overflow:hidden;border-radius:8px;background:#e9ebec}
.svc-photo img{width:100%;height:100%;object-fit:cover;display:block;transform-origin:center}
.svc-eyebrow{position:absolute;left:150px;top:250px;font-weight:600;font-size:22px;letter-spacing:.42em;
  color:var(--violet);text-transform:uppercase}
.svc-name{position:absolute;left:150px;top:320px;width:760px;font-size:64px}
.svc-body{position:absolute;left:150px;top:480px;width:700px;font-size:27px}
.svc-tag{position:absolute;left:150px;top:648px;display:flex;align-items:center;gap:16px;
  font-size:21px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--violet)}
.svc-dots{position:absolute;left:150px;top:868px;display:flex;gap:14px}
.svc-dots i{width:12px;height:12px;border-radius:50%;background:rgba(var(--petrol-rgb),.16)}
.svc-dots i.on{background:var(--lilac);box-shadow:0 0 0 5px rgba(var(--lilac-rgb),.25)}
/* pillars (s10) — chamfered card drawn as SVG so the stroke follows the cut
   (a clip-path would eat the border and the shadow) */
.pillar{position:relative;width:486px;height:296px;padding:42px 40px}
.pillar .frame{position:absolute;inset:0;filter:drop-shadow(0 18px 30px rgba(var(--petrol-rgb),.08))}
.pillar .n,.pillar h4,.pillar p{position:relative}
.pillar .n{font-size:23px;font-weight:800;letter-spacing:.22em;color:var(--lilac);margin-bottom:20px}
.pillar h4{font-size:36px;font-weight:800;margin-bottom:14px;letter-spacing:-.01em}
.pillar p{font-size:22.5px;font-weight:300;color:rgba(var(--petrol-rgb),.68);line-height:1.45}
/* differentiators (s11) */
.diff{position:absolute;width:790px;display:flex;gap:24px;align-items:flex-start}
.diff svg{flex:0 0 auto;margin-top:8px}
.diff b{display:block;font-size:31px;font-weight:700;letter-spacing:-.01em;margin-bottom:6px}
.diff span{font-size:24px;font-weight:300;color:rgba(var(--petrol-rgb),.62);line-height:1.4}
/* applicator logos (s12) */
.lg{position:absolute;width:250px;height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.lg img{max-width:210px;object-fit:contain;display:block;filter:brightness(0);opacity:.78}
.lg .cap{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(var(--petrol-rgb),.5);text-align:center;line-height:1.3}
/* contact (s13) */
.cfield{position:absolute;width:420px}
.cfield .l{font-size:18px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--violet);margin-bottom:10px}
.cfield .v{font-size:31px;font-weight:600;color:var(--petrol)}
/* persistent chrome */
#grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(var(--petrol-rgb),.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(var(--petrol-rgb),.045) 1px,transparent 1px);
  background-size:96px 96px}
#vig{position:absolute;inset:0;background:radial-gradient(1500px 900px at 50% 46%,transparent 55%,rgba(var(--petrol-rgb),.09) 100%)}
#grain{position:absolute;inset:0;opacity:.035;mix-blend-mode:multiply}
#wm{position:absolute;top:44px;right:52px;opacity:0}
#wm img{width:64px;display:block}
</style>

  <div class="scene" id="s13">

<script>
/* ============================== ENGINE (same contract as film.html / teaser.html) ============================== */
const C = window.CONTENT;
const RGB = h=>parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16);
const FPS = 30;
const $ = s => document.querySelector(s);
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const c01 = x=>clamp(x,0,1);
const lerp=(a,b,p)=>a+(b-a)*p;
const E = {
  lin:p=>p,
  o:p=>1-Math.pow(1-p,3),
  io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  oq:p=>1-Math.pow(1-p,5),
  oe:p=>p===1?1:1-Math.pow(2,-10*p),
  ob:p=>{const c=1.70158*1.2;return 1+ (c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);},
};

/* theme boot + T() — same contract as film.html */
const TDEF={petrol:'#1E2F38',deep:'#0f1a20',off:'#F5F2F0',orange:'#FF9D27',lilac:'#A490FF',violet:'#6040cc'};
window.applyTheme=function(theme){
  const r=document.documentElement.style;
  for(const k in TDEF){const v=(theme[k]||TDEF[k]);r.setProperty('--'+k,v);r.setProperty('--'+k+'-rgb',RGB(v));}
};
window.applyTheme(C.theme);
const TMAP=[];
for(const k in TDEF){const v=C.theme[k];if(v&&v.toLowerCase()!==TDEF[k].toLowerCase())TMAP.push([new RegExp(TDEF[k],'gi'),v]);}
const T=s=>{if(s==null)return s;let o=String(s);for(const[a,b]of TMAP)o=o.replace(a,b);return o;};

const anims=[];
function at(t0,dur,fn,ease){anims.push({t0,t1:t0+dur,ease:ease||E.o,fn});}
/* gated at(): holds the element's initial state until t0 instead of applying p=0
   every tick — needed when a later anim would otherwise stomp an earlier one */
function atg(t0,dur,fn,ease){at(t0,dur,(p,t)=>{if(t>=t0)fn(p,t);},ease);}
function tick(t){for(const a of anims){const p=a.t1>a.t0?c01((t-a.t0)/(a.t1-a.t0)):(t>=a.t0?1:0);a.fn(a.ease(p),t);}}
function rise(el,t0,dur,dy=60,ease=E.oq){el.style.opacity=0;at(t0,dur,p=>{el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px)`;},ease);}

/* scene windows — 72 s capability statement. AUTHORED seconds; live windows come
   from timeline.json (timeline.js), which time-warps the whole animation. */
const SC=[
  ['#s0',   0.0,  6.0],
  ['#s1',   6.0, 14.0],
  ['#s2',  14.0, 17.5],
  ['#s3',  17.5, 21.0],
  ['#s4',  21.0, 24.5],
  ['#s5',  24.5, 28.0],
  ['#s6',  28.0, 31.5],
  ['#s7',  31.5, 35.0],
  ['#s8',  35.0, 38.5],
  ['#s9',  38.5, 42.0],
  ['#s10', 42.0, 50.0],
  ['#s11', 50.0, 57.0],
  ['#s12', 57.0, 63.0],
  ['#s13', 63.0, 68.0],
  ['#s14', 68.0, 72.0],
];
const TL=(window.TIMELINE&&window.TIMELINE.film)||null;
const SC_EDIT=SC.map(([sel,a,b])=>{
  const s=TL&&(TL.scenes||[]).find(x=>'#'+x.id===sel);
  return s?[sel,+s.start,+s.end]:[sel,a,b];
});
const WARP_PTS=SC_EDIT.map(([_,a],i)=>[a,SC[i][1]]).concat([[SC_EDIT[SC_EDIT.length-1][2],SC[SC.length-1][2]]]);
function warp(t){
  const P=WARP_PTS;
  if(t<=P[0][0])return P[0][1]+(t-P[0][0]);
  for(let i=1;i<P.length;i++)if(t<=P[i][0]){
    const x0=P[i-1][0],y0=P[i-1][1],x1=P[i][0],y1=P[i][1];
    return x1>x0?y0+(t-x0)*(y1-y0)/(x1-x0):y1;
  }
  return P[P.length-1][1]+(t-P[P.length-1][0]);
}
const XF=0.5;
function sceneVis(t){
  for(const [sel,a,b] of SC){
    const el=$(sel);
    if(t>=a-0.02 && t<=b+0.02){
      el.style.display='block';
      let o=1;
      if(t<a+XF)o=c01((t-a)/XF);
      if(t>b-XF)o=Math.min(o,c01((b-t)/XF));
      el.style.opacity=o;
    } else el.style.display='none';
  }
}
const DUR = SC_EDIT[SC_EDIT.length-1][2];
at(6.3,0.8,p=>{$('#wm').style.opacity=p*0.55;});

/* small chamfered brick glyph — the WS bullet, lilac */
const BRICK='<svg width="24" height="32" viewBox="0 0 13 18" fill="none"><path d="M1.6 0 H13 V16.4 L11.4 18 H0 V1.6 Z" fill="var(--lilac)"/></svg>';

/* ============================== S0 COLD OPEN ============================== */
{
  rise($('#s0k'),0.5,0.9,26);
  rise($('#s0h'),1.0,1.1,44);
  at(1.0,2.0,p=>{$('#s0h').style.letterSpacing=lerp(0.012,-0.012,p)+'em';},E.oq);
  rise($('#s0lock'),2.6,1.0,34);
  atg(3.6,2.4,p=>{$('#s0lock').style.transform=`scale(${lerp(1,1.018,p)})`;},E.lin);
}

/* ============================== S1 WHO WE ARE ============================== */
{
  rise($('#s1k'),6.5,0.8,26);
  rise($('#s1t'),6.8,0.9,40);
  rise($('#s1lead'),7.3,0.9,34);
  rise($('#s1lead2'),7.7,0.9,34);
}

/* ============================== S10 THE WS STANDARD ============================== */
{
  rise($('#s10k'),42.5,0.8,26);
  rise($('#s10t'),42.8,0.9,38);
  rise($('#s10q'),45.4,0.9,30);
  const bar=$('#s10qbar');bar.style.opacity=0;
  at(45.1,0.6,p=>{bar.style.opacity=p;bar.style.transform=`scaleX(${p})`;},E.oq);
}

/* ============================== S11 WHY WS ============================== */
{
  rise($('#s11k'),50.5,0.8,26);
  rise($('#s11t'),50.8,0.9,38);
}

/* ============================== S12 APPLICATORS ============================== */
{
  rise($('#s12k'),57.4,0.8,26);
  rise($('#s12t'),57.7,0.9,38);
}

/* ============================== S13 CONTACT ============================== */
{
  rise($('#s13k'),63.4,0.8,26);
  rise($('#s13t'),63.7,0.9,36);
  rise($('#s13note'),65.6,0.9,22);
}

/* ============================== S14 END CARD ============================== */
{
  rise($('#s14lock'),68.5,1.0,36);
  rise($('#s14url'),70.2,0.8,22);
  // end on white — clean out for the mux tail
  const fadeEl=document.createElement('div');
  fadeEl.style.cssText='position:absolute;inset:0;background:#fff;opacity:0;z-index:99';
  $('#stage').appendChild(fadeEl);
  at(71.3,0.7,p=>{fadeEl.style.opacity=p;},E.io);
}

/* ============================== APPLY CONTENT ============================== */
{
  const set=(sel,html)=>{const el=$(sel);if(el&&html!=null)el.innerHTML=T(html);};
  set('#s0k',C.s0.kicker);set('#s0h',C.s0.headline);
  $('#s0chips').innerHTML=C.s0.chips.map(c=>`<span class="chip"><span class="dot"></span>${T(c)}</span>`).join('');
  [...document.querySelectorAll('#s0chips .chip')].forEach((el,i)=>rise(el,1.9+i*0.22,0.8,30));

  set('#s1k',C.s1.kicker);set('#s1t',C.s1.title);set('#s1lead',C.s1.lead);set('#s1lead2',C.s1.lead2);
  $('#s1card').innerHTML=C.s1.stats.map((s,i)=>
    (i?'<div class="statdiv"></div>':'')+
    `<div class="statrow"><b>${T(s.num)}</b><span>${T(s.label)}</span></div>`).join('');
  [...document.querySelectorAll('#s1card .statrow')].forEach((el,i)=>{
    rise(el,8.2+i*0.45,0.8,26);
    const b=el.querySelector('b');
    at(8.2+i*0.45,0.8,p=>{b.style.display='inline-block';b.style.transform=`scale(${lerp(0.6,1,p)})`;b.style.transformOrigin='left center';},E.ob);
  });
  rise($('#s1card'),8.0,0.9,44);

  /* service scenes s2–s9 from C.svc */
  const SVC0=14.0,SVCD=3.5,NSVC=C.svc.length;
  C.svc.forEach((s,i)=>{
    const a=SVC0+i*SVCD;
    const sc=$('#s'+(2+i));
    sc.innerHTML=
      `<div class="svc-eyebrow">${T(C.deliver.kicker)} · ${String(i+1).padStart(2,'0')} / ${String(NSVC).padStart(2,'0')}</div>`+
      `<h2 class="svc-name">${T(s.name)}</h2>`+
      `<div class="svc-body body">${T(s.body)}</div>`+
      `<div class="svc-tag">${BRICK}<span>${T(s.tag)}</span></div>`+
      `<div class="svc-dots">${C.svc.map((_,j)=>`<i${j===i?' class="on"':''}></i>`).join('')}</div>`+
      `<div class="svc-photo"><div class="ph"><img src="photos/${s.photo}"></div></div>`;
    rise(sc.querySelector('.svc-eyebrow'),a+0.10,0.6,22);
    rise(sc.querySelector('.svc-name'),a+0.22,0.7,34);
    rise(sc.querySelector('.svc-body'),a+0.38,0.7,28);
    rise(sc.querySelector('.svc-tag'),a+0.52,0.7,22);
    rise(sc.querySelector('.svc-dots'),a+0.30,0.7,16);
    const card=sc.querySelector('.svc-photo');card.style.opacity=0;
    at(a+0.05,0.75,p=>{card.style.opacity=p;card.style.transform=`translateX(${(1-p)*70}px)`;},E.oq);
    const img=sc.querySelector('.svc-photo img');
    at(a,SVCD+XF,p=>{img.style.transform=`scale(${lerp(1.085,1.0,p)})`;},E.lin);
  });

  set('#s10k',C.s10.kicker);set('#s10t',C.s10.title);
  set('#s10q','“'+C.s10.quote+'”');

window.DUR=DUR;window.FPS=FPS;window.TOTAL_FRAMES=Math.round(DUR*FPS);
window.seek=function(frame){
  const t=warp(frame/FPS);   // real time -> authored time; keyframes stay authored
  sceneVis(t);
  tick(t);
  return true;
};
window.readyP=Promise.all(
  [300,400,500,600,700,800].map(w=>document.fonts.load(`${w} 20px Saira`))
).then(()=>document.fonts.ready)
 .then(()=>Promise.all([...document.images].map(im=>im.decode().catch(()=>{}))))
 .then(()=>{window.seek(0);return true;});
if(location.hash==='#play'){
  const start=performance.now();
  (function loop(){const t=(performance.now()-start)/1000;if(t<DUR){window.seek(Math.floor(t*FPS));requestAnimationFrame(loop);}})();
