<style>

/* brand palette vars — same contract as film.html: the theme boot overwrites these
   from C.theme, so retheming is just setting vars */
:root{
  --petrol:#1E2F38; --petrol-rgb:30,47,56;
  --deep:#0f1a20;   --deep-rgb:15,26,32;
  --off:#F5F2F0;    --off-rgb:245,242,240;
  --orange:#FF9D27; --orange-rgb:255,157,39;
  --lilac:#A490FF;  --lilac-rgb:164,144,255;
  --violet:#6040cc; --violet-rgb:96,64,204;
  --orange-hi:#ffb658;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#000;width:1080px;height:1920px;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
  font-family:Saira,sans-serif;color:var(--off)}
#bg{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:none}
.kicker{font-weight:600;font-size:26px;letter-spacing:.4em;color:var(--orange);text-transform:uppercase}
.kicker .wst{color:var(--lilac)}
h1{font-weight:800;color:var(--off);line-height:1.06;letter-spacing:-.01em}
.body{font-weight:300;color:rgba(var(--off-rgb),.78);line-height:1.5}
.chip{display:inline-flex;align-items:center;gap:12px;border:1px solid rgba(var(--off-rgb),.22);
  border-radius:999px;padding:12px 26px;font-weight:500;font-size:26px;color:var(--off);
  background:rgba(var(--deep-rgb),.55);white-space:nowrap}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--orange);flex:0 0 auto}
.mono{font-family:'DejaVu Sans Mono',monospace}
svg text{font-family:Saira,sans-serif}
#grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(rgba(var(--off-rgb),.033) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(var(--off-rgb),.033) 1px,transparent 1px);
  background-size:96px 96px}
#vig{position:absolute;inset:0;background:radial-gradient(900px 1300px at 50% 46%,transparent 55%,rgba(5,10,13,.55) 100%)}
#grain{position:absolute;inset:0;opacity:.05;mix-blend-mode:overlay}
#wm{position:absolute;top:44px;right:48px;opacity:0}
#wm svg{width:62px;height:65px;display:block}
</style>

7"/><path class="lp" d="M58.5609 80.75V59.25H62.1834V68.375H72.3775V59.25H76V80.75H72.3775V71.4687H62.1834V80.75H58.5609Z" fill="#B7B7B7"/></svg></div>

<script>
/* ============================== ENGINE (same contract as film.html) ============================== */
const C = window.CONTENT;
const RGB = h=>parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16);
const FPS = 30;
const $ = s => document.querySelector(s);
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const c01 = x=>clamp(x,0,1);
const lerp=(a,b,p)=>a+(b-a)*p;
const E = {
  lin:p=>p,
  o:p=>1-Math.pow(1-p,3),
  io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  oq:p=>1-Math.pow(1-p,5),
  oe:p=>p===1?1:1-Math.pow(2,-10*p),
  ob:p=>{const c=1.70158*1.2;return 1+ (c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);},
};
function seeded(seed){let s=seed>>>0;return ()=> (s=(s*1664525+1013904223)>>>0)/4294967296;}

/* asset slots — window.ASSETS comes from assets.js (generated from assets/*.svg by
   figma_sync.py --local). Hosts carry data-asset="<name>"; art is LOADED, not built.
   Everything the choreography touches inside an asset is null-guarded, so replacement
   art pulled from Figma can never break the film. */
const ASSET=n=>T(((window.ASSETS||{})[n]||''));  // assets retheme through T() like all markup
const ASSETIN=n=>ASSET(n).replace(/^<svg[^>]*>/,'').replace(/<\/svg>\s*$/,'');

/* theme boot + T() — same contract as film.html */
const TDEF={petrol:'#1E2F38',deep:'#0f1a20',off:'#F5F2F0',orange:'#FF9D27',lilac:'#A490FF',violet:'#6040cc'};
window.applyTheme=function(theme){
  const r=document.documentElement.style;
  for(const k in TDEF){const v=(theme[k]||TDEF[k]);r.setProperty('--'+k,v);r.setProperty('--'+k+'-rgb',RGB(v));}
  if((theme.orange||TDEF.orange).toLowerCase()!==TDEF.orange.toLowerCase()){
    const h=theme.orange;
    r.setProperty('--orange-hi','#'+[1,3,5].map(i=>Math.round(lerp(parseInt(h.slice(i,i+2),16),255,0.28)).toString(16).padStart(2,'0')).join(''));
  }else r.removeProperty('--orange-hi');
};
window.applyTheme(C.theme);
const TMAP=[];
for(const k in TDEF){const v=C.theme[k];if(v&&v.toLowerCase()!==TDEF[k].toLowerCase())TMAP.push([new RegExp(TDEF[k],'gi'),v]);}
{const RGBA={orange:'255,157,39',lilac:'164,144,255',off:'245,242,240'};
 for(const k in RGBA){const v=C.theme[k];if(v&&RGB(v)!==RGBA[k])TMAP.push([new RegExp('rgba\\('+RGBA[k],'g'),'rgba('+RGB(v)]);}}
const T=s=>{if(s==null)return s;let o=String(s);for(const[a,b]of TMAP)o=o.replace(a,b);return o;};

const anims=[];
function at(t0,dur,fn,ease){anims.push({t0,t1:t0+dur,ease:ease||E.o,fn});}
function tick(t){for(const a of anims){const p=a.t1>a.t0?c01((t-a.t0)/(a.t1-a.t0)):(t>=a.t0?1:0);a.fn(a.ease(p),t);}}
function rise(el,t0,dur,dy=60,ease=E.oq){el.style.opacity=0;at(t0,dur,p=>{el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px)`;},ease);}
function riseKeep(el,t0,dur,dy,base,ease=E.oq){el.style.opacity=0;at(t0,dur,p=>{el.style.opacity=p;el.style.transform=base+` translateY(${(1-p)*dy}px)`;},ease);}
function pop(el,t0,dur=0.7){el.style.opacity=0;at(t0,dur,p=>{el.style.opacity=Math.min(1,p*1.6);el.style.transform=`scale(${lerp(.82,1,p)})`;},E.ob);}
function counter(el,t0,dur,from,to,fmt){at(t0,dur,p=>{el.textContent=fmt(Math.round(lerp(from,to,p)));},E.oe);}

/* scene windows — ~32 s Reels cut: cold open → pipeline → GeoClock → Pay → finale.
   AUTHORED seconds; live windows come from timeline.json (timeline.js), which
   time-warps the whole animation — see film.html for the same pattern. */
const SC=[
  ['#s0',   0.0,  6.0],
  ['#s1',   6.0, 13.5],
  ['#s6',  13.5, 20.5],
  ['#s9',  20.5, 26.0],
  ['#s10', 26.0, 32.0],
];
const TL=(window.TIMELINE&&window.TIMELINE.ig)||null;
const SC_EDIT=SC.map(([sel,a,b])=>{
  const s=TL&&(TL.scenes||[]).find(x=>'#'+x.id===sel);
  return s?[sel,+s.start,+s.end]:[sel,a,b];
});
const WARP_PTS=SC_EDIT.map(([_,a],i)=>[a,SC[i][1]]).concat([[SC_EDIT[SC_EDIT.length-1][2],SC[SC.length-1][2]]]);
function warp(t){
  const P=WARP_PTS;
  if(t<=P[0][0])return P[0][1]+(t-P[0][0]);
  for(let i=1;i<P.length;i++)if(t<=P[i][0]){
    const x0=P[i-1][0],y0=P[i-1][1],x1=P[i][0],y1=P[i][1];
    return x1>x0?y0+(t-x0)*(y1-y0)/(x1-x0):y1;
  }
  return P[P.length-1][1]+(t-P[P.length-1][0]);
}
const XF=0.55;
function sceneVis(t){
  for(const [sel,a,b] of SC){
    const el=$(sel);
    if(t>=a-0.02 && t<=b+0.02){
      el.style.display='block';
      let o=1;
      if(t<a+XF)o=c01((t-a)/XF);
      if(t>b-XF)o=Math.min(o,c01((b-t)/XF));
      el.style.opacity=o;
    } else el.style.display='none';
  }
}
const DUR = SC_EDIT[SC_EDIT.length-1][2];
at(6.5,0.8,p=>{$('#wm').style.opacity=p*0.9;});

/* ============================== BACKGROUND (asset) ============================== */
/* frozen bg -> #stage css background (layer-identical to the original); Figma-native
   replacement art -> injected into #bg. See film.html for the why. */
{const m=/<foreignObject[^>]*>[\s\S]*?background:([^"]+)"/.exec(ASSET('ig.bg'));
 if(m)$('#stage').style.background=m[1];else $('#bg').innerHTML=ASSET('ig.bg');}

/* ============================== S0 COLD OPEN ============================== */
{
  $('#s0logo').innerHTML=ASSET('ig.s0.logo');
  const paths=[...document.querySelectorAll('#s0logo path')];
  paths.forEach((ph,i)=>{
    ph.style.opacity=0;
    at(0.25+i*0.11,0.8,p=>{ph.style.opacity=p;ph.style.transform=`translateY(${(1-p)*24}px)`;ph.style.transformOrigin='center';},E.oq);
  });
  at(0.2,1.3,p=>{$('#s0logo').style.transform=`translateX(-50%) scale(${lerp(1.12,1,p)})`;},E.oq);
  at(1.5,4.5,p=>{$('#s0logo').style.transform=`translateX(-50%) scale(${lerp(1,1.04,p)})`;},E.lin);
  rise($('#s0k'),1.4,0.8,30);
  rise($('#s0h'),1.7,1.0,55);
  rise($('#s0b'),2.3,0.9,40);
}

/* ============================== S1 PIPELINE (vertical serpent) ============================== */
{
  const svg=$('#s1svg');
  const nodes=C.shared.stages.map((s,i)=>({x:540+(i%2?128:-128),y:452+i*182,label:s}));
  // art (asset slot, assets/ig.s1.pipeline.svg) and copy (JS layer) are separate
  // subtrees — see film.html
  svg.innerHTML=`<g data-asset="ig.s1.pipeline">${ASSETIN('ig.s1.pipeline')}</g><g id="s1lbls">`+
    nodes.map((n,i)=>{const side=n.x<540?1:-1;const tx=n.x+side*74;const anchor=side>0?'start':'end';
      return `<g class="s1lbl" opacity="0">
      <text x="${tx}" y="${n.y+2}" text-anchor="${anchor}" fill="${C.theme.off}" font-family="Saira" font-weight="600" font-size="34">${n.label}</text>
      <text x="${tx}" y="${n.y+40}" text-anchor="${anchor}" fill="rgba(${RGB(C.theme.lilac)},.9)" font-family="Saira" font-weight="500" font-size="23">${C.shared.codes[i]}</text>
    </g>`;}).join('')+`</g>`+
    `<circle id="s1puck" r="12" fill="${C.theme.off}" opacity="0"/>`;
  rise($('#s1k'),6.4,0.8,30);
  rise($('#s1h'),6.7,1.0,50);
  const path=svg.querySelector('#s1path');
  if(path){const L=path.getTotalLength();
    path.style.strokeDasharray=L;path.style.strokeDashoffset=L;
    at(7.2,2.8,p=>{path.style.strokeDashoffset=L*(1-p);},E.io);
    at(10.4,2.6,(p)=>{const pt=path.getPointAtLength(L*p);const pk=$('#s1puck');pk.setAttribute('cx',pt.x);pk.setAttribute('cy',pt.y);pk.setAttribute('opacity',p===0||p===1?0:1);},E.io);}
  nodes.forEach((n,i)=>{const a=svg.querySelector(`#s1n${i}`);if(a)pop(a,7.25+i*0.34,0.6);});
  [...svg.querySelectorAll('.s1lbl')].forEach((l,i)=>pop(l,7.25+i*0.34,0.6));
}

/* ============================== S6 GEOCLOCK ============================== */
{
  const svg=$('#s6map');
  // fabric + satellite fences frozen in assets/ig.s6.map.svg; hero/worker/badge live
  const hx=540,hy=1000;
  svg.innerHTML=`<g data-asset="ig.s6.map">${ASSETIN('ig.s6.map')}</g>`+
   `<g id="s6hero" opacity="0">
      <circle id="s6fence" cx="${hx}" cy="${hy}" r="150" fill="rgba(${RGB(C.theme.orange)},.10)" stroke="${C.theme.orange}" stroke-width="3.5"/>
      <circle id="s6ring" cx="${hx}" cy="${hy}" r="150" fill="none" stroke="${C.theme.off}" stroke-width="2" opacity="0"/>
      <circle id="s6ring2" cx="${hx}" cy="${hy}" r="150" fill="none" stroke="${C.theme.orange}" stroke-width="2" opacity="0"/>
      <text x="${hx}" y="${hy-176}" text-anchor="middle" fill="${C.theme.orange}" font-family="Saira" font-weight="700" font-size="30">${C.s6.heroLabel}</text>
    </g>
    <g id="s6worker" opacity="0">
      <circle id="s6wh" r="26" fill="none" stroke="${C.theme.lilac}" stroke-width="2" opacity=".6"/>
      <circle r="14" fill="${C.theme.lilac}"/><circle id="s6wdo" r="14" fill="${C.theme.orange}" opacity="0"/>
    </g>
    <g id="s6badge" opacity="0">
      <rect id="s6brect" x="${hx-205}" y="${hy+206}" width="410" height="66" rx="33" fill="${C.theme.deep}" stroke="rgba(${RGB(C.theme.off)},.35)" stroke-width="2"/>
      <circle id="s6bdot" cx="${hx-165}" cy="${hy+239}" r="8" fill="rgba(${RGB(C.theme.off)},.35)"/>
      <text id="s6btxt1" x="${hx+18}" y="${hy+249}" text-anchor="middle" fill="rgba(${RGB(C.theme.off)},.75)" font-family="Saira" font-weight="600" font-size="28">${C.s6.badgeOut}</text>
      <text id="s6btxt2" x="${hx+18}" y="${hy+249}" text-anchor="middle" fill="${C.theme.off}" font-family="Saira" font-weight="600" font-size="28" opacity="0">${C.s6.badgeIn}</text>
    </g>`;
  [...svg.querySelectorAll('.fence')].forEach((f,i)=>{at(14.4+i*0.12,0.6,p=>{f.setAttribute('opacity',p*0.9);},E.o);});
  at(15.2,0.8,p=>{$('#s6hero').setAttribute('opacity',p);});
  const WP=[[1120,1900],[770,1660],[700,1210],[600,1050]];
  const segL=[];let wtot=0;for(let i=1;i<WP.length;i++){const l=Math.hypot(WP[i][0]-WP[i-1][0],WP[i][1]-WP[i-1][1]);segL.push(l);wtot+=l;}
  const walk=p=>{let s=p*wtot;for(let i=0;i<segL.length;i++){if(s<=segL[i]||i===segL.length-1)return [lerp(WP[i][0],WP[i+1][0],Math.min(1,s/segL[i])),lerp(WP[i][1],WP[i+1][1],Math.min(1,s/segL[i]))];s-=segL[i];}};
  at(15.6,2.4,p=>{const w=$('#s6worker');const [x,y]=walk(p);
    w.setAttribute('transform',`translate(${x} ${y})`);w.setAttribute('opacity',p>0?1:0);},E.io);
  at(15.8,0.7,p=>{const b=$('#s6badge');b.setAttribute('opacity',p);b.setAttribute('transform',`translate(0 ${(1-p)*20})`);},E.oq);
  const TX=17.7;
  at(TX,1.0,p=>{const r=$('#s6ring');r.setAttribute('opacity',(1-p)*0.9);r.setAttribute('r',150+p*85);},E.o);
  at(TX+0.45,1.0,p=>{const r=$('#s6ring2');r.setAttribute('opacity',(1-p)*0.8);r.setAttribute('r',150+p*110);},E.o);
  at(TX,0.8,p=>{$('#s6fence').setAttribute('fill',`rgba(${RGB(C.theme.orange)},${(0.10+0.15*Math.sin(p*Math.PI)).toFixed(3)})`);},E.lin);
  at(TX,0.45,p=>{
    $('#s6wdo').setAttribute('opacity',p);
    if(p>0.5){$('#s6wh').setAttribute('stroke',C.theme.orange);$('#s6brect').setAttribute('stroke',C.theme.orange);$('#s6bdot').setAttribute('fill',C.theme.orange);}
    $('#s6btxt1').setAttribute('opacity',1-p);$('#s6btxt2').setAttribute('opacity',p);
    const k=1+0.07*Math.sin(p*Math.PI);
    $('#s6badge').setAttribute('transform',`translate(${hx*(1-k)} ${(hy+239)*(1-k)}) scale(${k})`);
  },E.io);
  rise($('#s6k'),13.9,0.8,30);
  rise($('#s6h'),14.2,1.0,50);
}

{

{

/* ============================== DRIVER ============================== */
window.DUR=DUR;window.FPS=FPS;window.TOTAL_FRAMES=Math.round(DUR*FPS);
window.seek=function(frame){
  const t=warp(frame/FPS);   // real time -> authored time; keyframes stay authored
  sceneVis(t);
  tick(t);
  return true;
};
window.readyP=Promise.all(
  [300,400,500,600,700,800].map(w=>document.fonts.load(`${w} 20px Saira`))
).then(()=>document.fonts.ready).then(()=>{window.seek(0);return true;});
if(location.hash==='#play'){
  const start=performance.now();
  (function loop(){const t=(performance.now()-start)/1000;if(t<DUR){window.seek(Math.floor(t*FPS));requestAnimationFrame(loop);}})();
}
