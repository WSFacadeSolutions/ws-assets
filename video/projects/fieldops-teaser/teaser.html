<script>
/* ============================== ENGINE (same contract as film-ig.html) ============================== */
const C = window.CONTENT;
const RGB = h=>parseInt(h.slice(1,3),16)+','+parseInt(h.slice(3,5),16)+','+parseInt(h.slice(5,7),16);
const FPS = 30;
const $ = s => document.querySelector(s);
const clamp = (x,a,b)=>Math.max(a,Math.min(b,x));
const c01 = x=>clamp(x,0,1);
const lerp=(a,b,p)=>a+(b-a)*p;
const E = {
  lin:p=>p,
  o:p=>1-Math.pow(1-p,3),
  io:p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,
  oq:p=>1-Math.pow(1-p,5),
  oe:p=>p===1?1:1-Math.pow(2,-10*p),
  ob:p=>{const c=1.70158*1.2;return 1+ (c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2);},
};

/* theme boot + T() — same contract as film.html */
const TDEF={petrol:'#1E2F38',deep:'#0f1a20',off:'#F5F2F0',orange:'#FF9D27',lilac:'#A490FF',violet:'#6040cc'};
window.applyTheme=function(theme){
  const r=document.documentElement.style;
  for(const k in TDEF){const v=(theme[k]||TDEF[k]);r.setProperty('--'+k,v);r.setProperty('--'+k+'-rgb',RGB(v));}
};
window.applyTheme(C.theme);
const TMAP=[];
for(const k in TDEF){const v=C.theme[k];if(v&&v.toLowerCase()!==TDEF[k].toLowerCase())TMAP.push([new RegExp(TDEF[k],'gi'),v]);}
const T=s=>{if(s==null)return s;let o=String(s);for(const[a,b]of TMAP)o=o.replace(a,b);return o;};

const anims=[];
function at(t0,dur,fn,ease){anims.push({t0,t1:t0+dur,ease:ease||E.o,fn});}
/* gated at(): holds the element's initial state until t0 instead of applying p=0
   every tick — needed when a later anim would otherwise stomp an earlier one */
function atg(t0,dur,fn,ease){at(t0,dur,(p,t)=>{if(t>=t0)fn(p,t);},ease);}
function tick(t){for(const a of anims){const p=a.t1>a.t0?c01((t-a.t0)/(a.t1-a.t0)):(t>=a.t0?1:0);a.fn(a.ease(p),t);}}
function rise(el,t0,dur,dy=60,ease=E.oq){el.style.opacity=0;at(t0,dur,p=>{el.style.opacity=p;el.style.transform=`translateY(${(1-p)*dy}px)`;},ease);}

/* scene windows — 20 s Reels teaser: cold open → the line builds → reveal.
   AUTHORED seconds; live windows come from timeline.json (timeline.js), which
   time-warps the whole animation — same pattern as film-ig.html. */
const SC=[
  ['#s0',  0.0,  3.0],
  ['#s1',  3.0, 13.0],
  ['#s2', 13.0, 20.0],
];
const TL=(window.TIMELINE&&window.TIMELINE.teaser)||null;
const SC_EDIT=SC.map(([sel,a,b])=>{
  const s=TL&&(TL.scenes||[]).find(x=>'#'+x.id===sel);
  return s?[sel,+s.start,+s.end]:[sel,a,b];
});
const WARP_PTS=SC_EDIT.map(([_,a],i)=>[a,SC[i][1]]).concat([[SC_EDIT[SC_EDIT.length-1][2],SC[SC.length-1][2]]]);
function warp(t){
  const P=WARP_PTS;
  if(t<=P[0][0])return P[0][1]+(t-P[0][0]);
  for(let i=1;i<P.length;i++)if(t<=P[i][0]){
    const x0=P[i-1][0],y0=P[i-1][1],x1=P[i][0],y1=P[i][1];
    return x1>x0?y0+(t-x0)*(y1-y0)/(x1-x0):y1;
  }
  return P[P.length-1][1]+(t-P[P.length-1][0]);
}
const XF=0.5;
function sceneVis(t){
  for(const [sel,a,b] of SC){
    const el=$(sel);
    if(t>=a-0.02 && t<=b+0.02){
      el.style.display='block';
      let o=1;
      if(t<a+XF)o=c01((t-a)/XF);
      if(t>b-XF)o=Math.min(o,c01((b-t)/XF));
      el.style.opacity=o;
    } else el.style.display='none';
  }
}
const DUR = SC_EDIT[SC_EDIT.length-1][2];
at(3.3,0.8,p=>{$('#wm').style.opacity=p*0.9;});

/* ============================== S0 COLD OPEN ============================== */
{
  const paths=[...document.querySelectorAll('#s0mark path')];
  paths.forEach((ph,i)=>{
    ph.style.opacity=0;
    at(0.25+i*0.1,0.8,p=>{ph.style.opacity=p;ph.style.transform=`translateY(${(1-p)*22}px)`;ph.style.transformOrigin='center';},E.oq);
  });
  at(0.2,1.2,p=>{$('#s0mark').style.transform=`translateX(-50%) scale(${lerp(1.1,1,p)})`;},E.oq);
  atg(1.4,1.4,p=>{$('#s0mark').style.transform=`translateX(-50%) scale(${lerp(1,1.03,p)})`;},E.lin);
  rise($('#s0k'),1.2,0.9,30);
}

/* ============================== THE LINE (persistent draw layer) ==============================
   One continuous lilac-tipped stroke draws the whole story: a facade elevation,
   the phone around it, the geofence around the site, the clock-in card, the
   approval tick — then leaves the phone and becomes the FIELD OPS underline.
   Every write below is a pure function of t (both branches written), so
   parallel renderers can seek any frame cold. */
{
  const PEN=[   // [id, t0, t1, drawn stroke width]
    ['p_fac',   3.35, 4.55, 4],
    ['p_grid2', 4.55, 5.45, 3],
    ['p_phone', 5.90, 7.30, 5],
    ['p_spk',   7.35, 7.50, 4],
    ['p_fence', 7.70, 8.90, 4],
    ['p_card',  9.50,10.40, 4],
    ['p_clock',10.45,10.90, 4],
    ['p_lines',10.95,11.25, 5],
    ['p_tickc',11.30,11.60, 4],
    ['p_tick', 11.65,11.95, 5],
    ['p_exit', 12.70,13.60, 5],
    ['p_under',13.70,14.30, 6],
  ];
  const segs=PEN.map(([id,t0,t1,w])=>{
    const el=$('#'+id);
    const len=el.getTotalLength();
    el.setAttribute('stroke-width',w);
    if(id!=='p_exit'&&id!=='p_under'){
      // draw-on: dash the full length, retract the offset with t
      at(t0,t1-t0,(p)=>{
        el.style.strokeDashoffset=(1-p)*len;
      },E.io);
      el.setAttribute('stroke-dasharray',len);
      el.style.strokeDashoffset=len;
    }
    return {id,el,len,t0,t1};
  });

  // fence: solid while drawn, "sets" to dashed lilac once complete — both
  // branches written every tick, so scrubbing backwards restores the solid line
  const fence=$('#p_fence'),FL=fence.getTotalLength();
  at(8.9,0.5,(p,t)=>{
    if(t>=8.95){fence.setAttribute('stroke-dasharray','16 13');fence.style.strokeDashoffset=0;
                fence.setAttribute('stroke','var(--lilac)');}
    else{fence.setAttribute('stroke-dasharray',FL);fence.setAttribute('stroke','var(--petrol)');}
  },E.lin);

  // worker dot inside the fence + ONE sober ring pulse (the GeoClock nod);
  // gated — an ungated decreasing anim would show the ring from t=0
  at(9.0,0.5,p=>{$('#p_dot').setAttribute('opacity',p);},E.oq);
  atg(9.15,1.2,p=>{const r=$('#p_ring');r.setAttribute('opacity',(1-p)*0.6);r.setAttribute('r',10+p*70);},E.o);

  // phone screen solidifies once its outline closes
  at(7.3,0.6,p=>{$('#p_fill').setAttribute('opacity',p*0.92);},E.o);

  // approval: tick sets lilac, card floor tint fades in
  at(11.95,0.4,(p,t)=>{
    const on=t>=11.95;
    $('#p_tick').setAttribute('stroke',on?'var(--lilac)':'var(--petrol)');
    $('#p_tickc').setAttribute('stroke',on?'var(--lilac)':'var(--petrol)');
    $('#p_cardf').setAttribute('opacity',on?p*0.07:0);
  },E.o);

  // exit swoosh: a travelling dash segment — the head advances, the tail
  // follows, nothing remains (the line "leaves" the phone)
  const ex=$('#p_exit'),EL=ex.getTotalLength(),SEG=170;
  ex.setAttribute('stroke-dasharray',`${SEG} ${EL+SEG}`);
  ex.style.strokeDashoffset=SEG;
  at(12.70,0.90,p=>{ex.style.strokeDashoffset=SEG-p*(EL+SEG);},E.io);

  // underline under FIELD OPS: normal draw-on, stays
  const un=$('#p_under'),UL=un.getTotalLength();
  un.setAttribute('stroke-dasharray',UL);
  un.style.strokeDashoffset=UL;
  at(13.70,0.60,p=>{un.style.strokeDashoffset=(1-p)*UL;},E.io);
  // the whole draw layer bows out with the end fade
  atg(19.0,0.8,p=>{$('#draw').style.opacity=1-p;},E.io);

  // reveal shrink: the finished drawing scales up-stage to make room for the
  // title block. Same transform maths feed the pen position mapping below.
  const shrink=t=>{const p=E.io(c01((t-13.0)/1.1));return {s:lerp(1,0.80,p),dy:lerp(0,-230,p)};};
  at(13.0,1.1,(p,t)=>{
    const {s,dy}=shrink(t);
    $('#g1').setAttribute('transform',`translate(0 ${dy}) translate(540 900) scale(${s}) translate(-540 -900)`);
  },E.lin);

  // pen tip: one lilac dot rides the active path (getPointAtLength is pure in t);
  // wrapper paths are mapped through the same shrink transform
  const pen=$('#pen');
  anims.push({t0:0,t1:0.01,ease:E.lin,fn:(_,t)=>{
    let seg=null,pp=0;
    for(const s of segs){
      if(t>=s.t0&&t<=s.t1+0.12){seg=s;pp=c01((t-s.t0)/(s.t1-s.t0));break;}
    }
    if(!seg||t<PEN[0][1]-0.02){pen.setAttribute('opacity',0);return;}
    let pt;
    if(seg.id==='p_exit'){
      // follow the head of the travelling dash
      pt=seg.el.getPointAtLength(Math.min(E.io(pp)*(seg.len+SEG),seg.len));
    }else{
      pt=seg.el.getPointAtLength(E.io(pp)*seg.len);
    }
    let x=pt.x,y=pt.y;
    if(seg.id!=='p_exit'&&seg.id!=='p_under'){
      const {s,dy}=shrink(t);
      x=540+(x-540)*s; y=900+(y-900)*s+dy;
    }
    pen.setAttribute('cx',x);pen.setAttribute('cy',y);
    pen.setAttribute('opacity',t<=seg.t1?0.95:c01(1-(t-seg.t1)/0.12)*0.95);
  }});
}
